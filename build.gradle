plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = '1.0.0'
group = 'dev.karma.etchedtweaks'
base { archivesName = 'etchedtweaks' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir 'vendor/jaad-src'
if (project.hasProperty('smoke')) sourceSets.main.java.srcDir 'src/smoke/java'
repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { etchedtweaks { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { etchedtweaks { source sourceSets.main } } }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('libs/etched-3.0.4.jar', 'libs/sophisticatedcore-1.20.1-1.3.74.2217.jar')
    testImplementation files('libs/etched-3.0.4.jar', 'libs/sophisticatedcore-1.20.1-1.3.74.2217.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Development launches only; these mods are never bundled into the output JAR.
    if (project.hasProperty('smoke')) {
        runtimeOnly fg.deobf('reference:etched:3.0.4')
        if (project.property('smoke') in ['with', 'storage']) {
            runtimeOnly fg.deobf('reference:sophisticatedcore:1.20.1-1.3.74.2217')
            runtimeOnly fg.deobf('reference:sophisticatedbackpacks:1.20.1-3.24.63.2044')
            if (project.property('smoke') == 'storage') runtimeOnly fg.deobf('reference:sophisticatedstorage:1.20.1-1.4.79.2056')
        }
    }
}
mixin { add sourceSets.main, 'etchedtweaks.refmap.json'; config 'etchedtweaks.mixins.json' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar {
    manifest.attributes('MixinConfigs': 'etchedtweaks.mixins.json', 'Implementation-Version': project.version)
    from('vendor/JAAD-NOTICE.txt') { into 'META-INF' }
    from('LICENSE') { into 'META-INF' }
    finalizedBy 'reobfJar'
}
['EtchedCompat', 'JukeboxPlayback', 'SoundCloudPns', 'OptionalIsolation'].each { checkName ->
    tasks.register('verify' + checkName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.karma.etchedtweaks.compat.etched.' + checkName + 'Check'
        if (checkName == 'EtchedCompat' && project.hasProperty('soundCloudFixture')) {
            args project.property('soundCloudFixture'), project.findProperty('soundCloudDuration') ?: '0'
        }
    }
}
tasks.named('check') { dependsOn 'verifyEtchedCompat', 'verifyJukeboxPlayback', 'verifySoundCloudPns', 'verifyOptionalIsolation' }
